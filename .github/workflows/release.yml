name: Build e release

# Crea i pacchetti .pkg per Mac:
#   arm64  (Apple Silicon, macOS 12.3 o successivo)
#   x86_64 (Intel, macOS 10.15 Catalina o successivo)
# - Push su main con una versione nuova in blackmix/__init__.py
#   (o push di un tag "v0.2.0")  -> costruisce e pubblica la release;
#   le app installate la trovano e propongono l'aggiornamento
# - Push su main con versione gia' pubblicata -> non fa nulla
# - Avvio manuale -> costruisce soltanto, i .pkg si scaricano dagli artifact
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' blackmix/__init__.py)"
          PUBLISH=false
          SKIP=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"; PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "La versione $V e' gia' pubblicata: niente da fare."
              SKIP=true
            else
              PUBLISH=true
            fi
          else
            V="$V-dev.${GITHUB_RUN_NUMBER}"
          fi
          { echo "version=$V"; echo "publish=$PUBLISH"; echo "skip=$SKIP"; } >> "$GITHUB_OUTPUT"
          echo "Versione: $V  pubblica: $PUBLISH"

  build:
    needs: prepara
    if: needs.prepara.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            arch: arm64
          - runner: macos-15-intel     # Intel, pacchetto compatibile con Catalina
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepara.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Costruisci app e pacchetto
        run: bash packaging/build_pkg.sh "$VERSION"

      - name: Prova un mix con l'app costruita
        run: |
          APP="$GITHUB_WORKSPACE/build/root/BlackMix.app/Contents"
          export PYTHONPATH="$APP/Resources/app"
          mkdir -p /tmp/prova && cd /tmp/prova
          "$APP/Resources/python/bin/python3" "$GITHUB_WORKSPACE/strumenti/crea_progetto_prova.py"
          "$APP/Resources/python/bin/python3" -m blackmix.cli "Canzone Prova.logicx" -o /tmp/prova/mix.wav
          test -s /tmp/prova/mix.wav

      - uses: actions/upload-artifact@v4
        with:
          name: BlackMix-${{ env.VERSION }}-${{ matrix.arch }}
          path: build/*.pkg

  release:
    needs: [prepara, build]
    if: needs.prepara.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepara.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pubblica la release
        run: |
          ls -lh dist
          TAG="v$VERSION"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.pkg --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.pkg --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" \
              --title "BlackMix $VERSION" \
              --notes "Scarica il pacchetto giusto per il tuo Mac:
          - **arm64**: Mac con Apple Silicon (M1, M2, M3…), macOS 12.3 o successivo
          - **x86_64**: Mac con processore Intel, macOS 10.15 Catalina o successivo"
          fi
